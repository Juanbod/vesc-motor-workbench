[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vesc-esc-workbench"
version = "0.1.0"
description = "Safe Python workbench for VESC/ESC configuration staging and UART tests."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyserial>=3.5",
]

[project.scripts]
vesc-workbench = "vesc_workbench.cli:main"
vesc-autotest = "vesc_workbench.cli:main"

[tool.setuptools]
packages = ["vesc_workbench"]

[tool.setuptools.package-data]
vesc_workbench = ["fw602-layout.json"]
